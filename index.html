<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0a0b0d" />
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='7' fill='%230f1013'/><path d='M11 9.5c0-.8.7-1.5 1.5-1.5h2l1.5 4-2 1.3a8.5 8.5 0 0 0 4.7 4.7l1.3-2 4 1.5v2c0 .8-.7 1.5-1.5 1.5C15.6 21 11 16.4 11 9.5Z' fill='%23e5b54b'/></svg>" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Prospecção" />
    <title>Central de Prospecção</title>
    <script>
      // Aplica o tema salvo antes do primeiro desenho (evita piscar)
      try {
        var p = localStorage.getItem('central-prospeccao:tema') || 'dark'
        var light = p === 'light' || (p === 'system' && matchMedia('(prefers-color-scheme: light)').matches)
        document.documentElement.dataset.theme = light ? 'light' : 'dark'
      } catch (e) {
        document.documentElement.dataset.theme = 'dark'
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
