<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <style>
      body { margin: 0; width: 260px; background: #0b0c0e; color: #e8e9ec; font: 12px/1.45 system-ui, -apple-system, 'Segoe UI', sans-serif; }
      main { padding: 14px; }
      h1 { margin: 0 0 10px; font-size: 13px; font-weight: 600; }
      .linha { display: flex; align-items: center; gap: 8px; padding: 8px 0; border-top: 1px solid #1d1f24; }
      .ponto { width: 7px; height: 7px; border-radius: 50%; background: #555; flex: none; }
      .ok { background: #34d399; }
      .ruim { background: #f87171; }
      .fraco { color: #8b8f98; }
      button { width: 100%; margin-top: 10px; height: 30px; border: 1px solid #2a2d33; border-radius: 6px; background: #16181c; color: #e8e9ec; font: inherit; cursor: pointer; }
      button.principal { background: #2563eb; border-color: #2563eb; color: #fff; font-weight: 600; }
    </style>
  </head>
  <body>
    <main>
      <h1>XS · Instagram</h1>
      <div class="linha"><span id="ponto" class="ponto"></span><span id="conta">Conferindo o Instagram…</span></div>
      <p class="fraco" style="margin: 6px 0 0">Busque e acompanhe tudo pela XS, na tela <b>Instagram</b>.</p>
      <button id="xs" class="principal">Abrir a XS</button>
      <button id="ig">Abrir o Instagram</button>
    </main>
    <script src="popup.js"></script>
  </body>
</html>
